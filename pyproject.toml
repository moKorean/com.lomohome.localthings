[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "com-lomohome-localthings"
version = "0.1.0"
description = "Homey app for local control of Samsung appliances over DTLS/CoAP, without SmartThings"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Geunwon Mo", email = "mokorean@gmail.com" }]

# Runtime dependencies are declared in app.json's `pythonPackages`, which is
# what Homey actually installs. Kept in sync here so local dev and tests can
# `pip install -e .` and import the same versions.
dependencies = [
    "smartthings-local>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a real appliance on the LAN (run with -m integration)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# A purposeful set rather than "ALL": correctness and modernisation rules earn their
# keep here, docstring-formatting rules would only add churn to a codebase that
# documents *why* in prose at the top of each module.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade — the runtime is pinned at 3.14, so use it
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff's own
]
ignore = [
    # Broad excepts are deliberate. Most of this app talks to two contracts it does
    # not control and cannot enumerate: an appliance's OCF firmware, and a
    # partly-undocumented Homey Python SDK. Narrowing them would mean guessing which
    # exception types those raise, and guessing wrong turns a recoverable read into a
    # crashed device. Where the breadth matters, the reason is at the site.
    "BLE001",
    # Korean UI strings and en-dashes in prose are intentional.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# app.py, api.py and the drivers put the app directory on sys.path before importing
# the homey package, which E402 flags.
"app.py" = ["E402"]
"api.py" = ["E402"]
"drivers/**/*.py" = ["E402"]
