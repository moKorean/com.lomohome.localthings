<style>
  /* The pairing webview mixes in its own base styles, so colours are pinned
     rather than following prefers-color-scheme. */
  :root {
    --blue: #1428A0;
    --bg: #f2f2f5;
    --card: #ffffff;
    --text: #1b1b1f;
    --muted: #66666e;
    --border: #e2e2e8;
    --ok: #1e8449;
    --warn: #b9770e;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg) !important; }
  body {
    margin: 0; color: var(--text); font-size: 14px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  h2 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: var(--muted); }
  ol { padding-left: 20px; color: var(--muted); margin: 0; }
  li { margin-bottom: 7px; }
  code {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    background: #eeeef2; padding: 1px 5px; border-radius: 5px; color: var(--text);
  }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 13px; }
  input[type=text] {
    width: 100%; padding: 9px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 6px;
  }
  button {
    margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 6px;
    background: var(--blue); color: #fff; font-size: 15px; cursor: pointer;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .msg { margin-top: 13px; font-size: 13px; white-space: pre-wrap; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .msg.warn { color: var(--warn); }
  .spinner {
    display: inline-block; width: 12px; height: 12px; margin-right: 7px;
    border: 2px solid #c9c9d2; border-top-color: var(--blue);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary {
    background: #f4f5f7; border-radius: 8px; padding: 11px;
    margin-top: 13px; font-size: 13px;
  }
  .result {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-top: 9px; background: #fafafc;
  }
  .result-main { min-width: 0; }
  .result-title { font-weight: 600; font-size: 13.5px; }
  .result-sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .result button { margin: 0; padding: 7px 13px; font-size: 13px; flex: 0 0 auto; }
  .result.unknown { opacity: .75; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  a { color: var(--blue); font-size: 13px; }
  .hidden { display: none; }
</style>

<div class="wrap">
  <!-- Shown when the app has no certificate yet. Pairing cannot work until it
       does, so this explains where to go rather than failing at Connect. -->
  <div id="setup" class="card hidden">
    <h2 id="t-setup-title"></h2>
    <p id="t-setup-lede"></p>
    <ol id="setup-steps"></ol>
  </div>

  <div id="search-step" class="card hidden">
    <h2 id="t-search-title"></h2>
    <p id="t-search-lede"></p>
    <button id="btn-search"><span id="t-search"></span></button>
    <div id="search-msg" class="msg"></div>
    <div id="results"></div>
    <p class="meta" id="t-manual-toggle-hint"></p>
    <a href="#" id="btn-manual"><span id="t-manual"></span></a>
  </div>

  <div id="host-step" class="card hidden">
    <h2 id="t-host-title"></h2>
    <p id="t-host-lede"></p>
    <label id="t-host-label"></label>
    <input type="text" id="host" placeholder="192.168.1.90" inputmode="decimal" autocomplete="off" />
    <button id="btn-connect"><span id="t-connect"></span></button>
    <div id="msg" class="msg"></div>
    <div id="summary" class="summary hidden"></div>
  </div>

  <!-- Visible from the start so a failure before init can never leave the view
       blank; replaced by one of the cards above as soon as init runs. -->
  <div id="boot" class="card">
    <p><span class="spinner"></span><span id="t-boot"></span></p>
  </div>
</div>

<script type="text/javascript">
  var H = null;
  var started = false;
  var LANG = 'en';

  var STRINGS = {
    en: {
      boot: 'Loading…',
      setupTitle: 'Set up required',
      setupLede: 'This app needs a client certificate before it can reach your appliances. It is a one-time setup and covers every Samsung appliance on your network.',
      setupSteps: [
        'Close this window.',
        'Go to <b>Settings → Apps → LocalThings community</b>.',
        'Follow the instructions there to obtain and paste a certificate.',
        'Come back to <b>Devices → Add device → LocalThings community</b>.',
      ],
      searchTitle: 'Find appliances',
      searchLede: 'Scans your network for Samsung appliances that speak the local protocol, then identifies each one. Takes under a minute.',
      search: 'Search',
      searching: 'Scanning the network… about 15 seconds.',
      identifying: 'Found {0} that answered — identifying each. This is the slow part: every one needs its own encrypted handshake, and devices that turn out not to be Samsung appliances take longest to rule out.',
      progress: 'Checking {0} ({1} of {2})…',
      foundNone: 'No appliances answered on {0}. Older firmware and units on another subnet are not found this way; you can still enter an address by hand.',
      foundSome: 'Found {0} on {1}.',
      addThis: 'Add',
      unknownType: 'Unsupported type',
      unknownSub: '{0} · {1} resources · cannot be added yet',
      manualHint: 'Not listed? Some units answer only on ports this scan skips.',
      manual: 'Enter an IP address instead',
      hostTitle: 'Add an appliance',
      hostLede: 'Enter the appliance’s IP address. The port is detected automatically. Find the address in your router’s client list, or in the SmartThings app under the appliance’s network information.',
      hostLabel: 'IP address',
      connect: 'Connect',
      probing: 'Scanning ports and reading appliance state… this can take up to a minute.',
      needHost: 'Enter the appliance’s IP address.',
      unsupported: 'Connected successfully, but this appliance type is not supported yet.',
      unsupportedHint: 'Model {0}, {1} resources. Please open an issue with this model number so support can be added.',
      creating: 'Connected. Adding the appliance…',
      capabilities: '{0} controls available',
    },
    ko: {
      boot: '불러오는 중…',
      setupTitle: '설정이 필요합니다',
      setupLede: '가전에 연결하려면 클라이언트 인증서가 먼저 필요합니다. 최초 1회만 하면 되고, 집 안 모든 삼성 가전에 적용됩니다.',
      setupSteps: [
        '이 창을 닫습니다.',
        '<b>설정 → 앱 → 로컬띵스 커뮤니티</b>로 이동합니다.',
        '거기 안내에 따라 인증서를 발급해 붙여넣습니다.',
        '다시 <b>기기 → 기기 추가 → 로컬띵스 커뮤니티</b>로 돌아옵니다.',
      ],
      searchTitle: '가전 검색',
      searchLede: '로컬 프로토콜을 사용하는 삼성 가전을 네트워크에서 찾아 종류까지 확인합니다. 1분 이내에 끝납니다.',
      search: '검색',
      searching: '네트워크를 훑는 중… 약 15초 걸립니다.',
      identifying: '응답한 기기 {0}대 발견 — 각각 확인 중입니다. 이 단계가 오래 걸립니다: 기기마다 암호화 핸드셰이크를 따로 해야 하고, 삼성 가전이 아닌 기기는 판정에 가장 오래 걸립니다.',
      progress: '{0} 확인 중 ({2}대 중 {1}번째)…',
      foundNone: '{0}에서 응답한 가전이 없습니다. 구형 펌웨어나 다른 서브넷의 기기는 이 방식으로 찾지 못합니다. 주소를 직접 입력할 수도 있습니다.',
      foundSome: '{1}에서 {0}대를 찾았습니다.',
      addThis: '추가',
      unknownType: '미지원 종류',
      unknownSub: '{0} · 리소스 {1}개 · 아직 추가할 수 없습니다',
      manualHint: '목록에 없나요? 이 검색이 건너뛴 포트만 응답하는 기기가 있을 수 있습니다.',
      manual: '대신 IP 주소 직접 입력',
      hostTitle: '가전 추가',
      hostLede: '가전의 IP 주소를 입력하세요. 포트는 자동으로 찾습니다. 주소는 공유기의 접속 기기 목록이나 SmartThings 앱의 네트워크 정보에서 확인할 수 있습니다.',
      hostLabel: 'IP 주소',
      connect: '연결',
      probing: '포트를 찾고 기기 상태를 읽는 중… 최대 1분 정도 걸릴 수 있습니다.',
      needHost: '가전의 IP 주소를 입력하세요.',
      unsupported: '연결은 성공했지만 아직 지원되지 않는 가전 종류입니다.',
      unsupportedHint: '모델 {0}, 리소스 {1}개. 지원 추가를 위해 이 모델명으로 이슈를 등록해 주세요.',
      creating: '연결됨. 가전을 추가하는 중…',
      capabilities: '사용 가능한 항목 {0}개',
    },
  };

  function t(key) {
    var s = STRINGS[LANG][key];
    if (s === undefined) s = STRINGS.en[key];
    for (var i = 1; i < arguments.length; i++) {
      s = s.replace('{' + (i - 1) + '}', arguments[i]);
    }
    return s;
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function show(id, visible) {
    document.getElementById(id).classList.toggle('hidden', !visible);
  }

  function message(kind, text, loading) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (kind || '');
    el.innerHTML = (loading ? '<span class="spinner"></span>' : '')
      + (text || '').replace(/</g, '&lt;');
  }

  function applyStrings() {
    setText('t-boot', t('boot'));
    setText('t-setup-title', t('setupTitle'));
    setText('t-setup-lede', t('setupLede'));
    setText('t-search-title', t('searchTitle'));
    setText('t-search-lede', t('searchLede'));
    setText('t-search', t('search'));
    setText('t-manual-toggle-hint', t('manualHint'));
    setText('t-manual', t('manual'));
    setText('t-host-title', t('hostTitle'));
    setText('t-host-lede', t('hostLede'));
    setText('t-host-label', t('hostLabel'));
    setText('t-connect', t('connect'));
    var ol = document.getElementById('setup-steps');
    ol.innerHTML = '';
    STRINGS[LANG].setupSteps.forEach(function (step) {
      var li = document.createElement('li');
      li.innerHTML = step;
      ol.appendChild(li);
    });
  }

  function searchMessage(kind, text, loading) {
    var el = document.getElementById('search-msg');
    el.className = 'msg ' + (kind || '');
    el.innerHTML = (loading ? '<span class="spinner"></span>' : '')
      + (text || '').replace(/</g, '&lt;');
  }

  function addDiscovered(entry, button) {
    button.disabled = true;
    searchMessage('ok', t('creating'), true);
    H.createDevice(entry.device)
      .then(function () { return H.done(); })
      .catch(function (err) {
        button.disabled = false;
        searchMessage('err', String((err && err.message) || err));
      });
  }

  function renderResults(appliances) {
    var box = document.getElementById('results');
    box.innerHTML = '';
    appliances.forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'result' + (entry.recognised ? '' : ' unknown');

      var main = document.createElement('div');
      main.className = 'result-main';
      var title = document.createElement('div');
      title.className = 'result-title';
      title.textContent = entry.recognised ? entry.title : t('unknownType');
      var sub = document.createElement('div');
      sub.className = 'result-sub';
      sub.textContent = entry.recognised
        ? entry.host + ' · ' + entry.model + ' · ' + t('capabilities', entry.capability_count)
        : entry.host + ' · ' + t('unknownSub', entry.model, entry.resource_count);
      main.appendChild(title);
      main.appendChild(sub);
      row.appendChild(main);

      if (entry.recognised) {
        var add = document.createElement('button');
        add.textContent = t('addThis');
        add.addEventListener('click', function () { addDiscovered(entry, add); });
        row.appendChild(add);
      }
      box.appendChild(row);
    });
  }

  function search() {
    var button = document.getElementById('btn-search');
    button.disabled = true;
    document.getElementById('results').innerHTML = '';
    searchMessage('', t('searching'), true);

    if (H.on) {
      H.on('discover_progress', function (p) {
        if (!p) return;
        if (p.phase === 'identifying') {
          searchMessage('', t('identifying', p.total), true);
        } else if (p.phase === 'host') {
          searchMessage('', t('progress', p.host, p.index, p.total), true);
        }
      });
    }

    H.emit('discover', { language: LANG })
      .then(function (result) {
        button.disabled = false;
        var found = (result && result.appliances) || [];
        if (!found.length) {
          searchMessage('warn', t('foundNone', (result && result.scanned) || ''));
          return;
        }
        searchMessage('ok', t('foundSome', found.length, result.scanned));
        renderResults(found);
      })
      .catch(function (err) {
        button.disabled = false;
        searchMessage('err', String((err && err.message) || err));
      });
  }

  function connect() {
    var button = document.getElementById('btn-connect');
    var host = document.getElementById('host').value.trim();
    if (!host) return message('err', t('needHost'));

    show('summary', false);
    button.disabled = true;
    message('', t('probing'), true);

    H.emit('probe', { host: host, language: LANG })
      .then(function (result) {
        button.disabled = false;
        if (!result.recognised) {
          message('err', t('unsupported') + '\n'
            + t('unsupportedHint', result.model, result.resource_count));
          return;
        }
        message('ok', t('creating'), true);
        var summary = document.getElementById('summary');
        summary.textContent = result.model + ' · ' + t('capabilities', result.capability_count);
        show('summary', true);
        return H.createDevice(result.device).then(function () { return H.done(); });
      })
      .catch(function (err) {
        button.disabled = false;
        message('err', String((err && err.message) || err));
      });
  }

  // Ask the webview itself first. The driver also reports a language, but it has
  // to guess at an undocumented Python i18n contract, whereas the view is handed a
  // Homey object that already knows. Both paths are tried before giving up.
  // Order matters. getLanguage() is asked first because it is the UI language;
  // Homey.language is only a cached property and the driver's answer comes from
  // the Python i18n manager, which reports the *app's* language ('en' unless the
  // user's language happens to be the app's default) rather than the user's.
  function resolveLanguage(fromDriver) {
    return new Promise(function (resolve) {
      var settled = false;
      function done(value) {
        if (settled) return;
        settled = true;
        var lang = String(value || H.language || fromDriver || '')
          .slice(0, 2).toLowerCase();
        if (lang === 'ko') LANG = 'ko';
        resolve();
      }
      try {
        var maybe = H.getLanguage && H.getLanguage(function (err, value) {
          done(err ? null : value);
        });
        if (maybe && typeof maybe.then === 'function') {
          maybe.then(done, function () { done(null); });
        } else if (typeof maybe === 'string') {
          done(maybe);
        }
      } catch (e) { /* fall through */ }
      // Never let a missing contract stall the view.
      setTimeout(function () { done(null); }, 2500);
    });
  }

  function reportEnvironment(fromDriver) {
    var info = {
      language_property: typeof H.language === 'string' ? H.language : typeof H.language,
      has_getLanguage: typeof H.getLanguage,
      driver_language: fromDriver || null,
      resolved: LANG,
      homey_keys: [],
    };
    try {
      for (var k in H) { if (typeof H[k] === 'function') info.homey_keys.push(k); }
      info.homey_keys = info.homey_keys.sort().slice(0, 40);
    } catch (e) { /* ignore */ }
    try { H.emit('report_env', info); } catch (e) { /* ignore */ }
  }

  function bootstrap() {
    H.emit('get_state', {})
      .then(function (state) {
        return resolveLanguage(state && state.language).then(function () {
          reportEnvironment(state && state.language);
          return state;
        });
      })
      .then(function (state) {
        applyStrings();
        show('boot', false);
        show('setup', !state.has_credentials);
        show('search-step', !!state.has_credentials);
        show('host-step', false);
      })
      .catch(function (err) {
        // Falling back to the address form keeps the view usable; the real
        // problem then surfaces from Connect with the driver's own message.
        applyStrings();
        show('boot', false);
        show('host-step', true);
        message('err', String((err && err.message) || err));
      });
  }

  // See the settings page for why this checks methods rather than the global's
  // existence: the global starts life as homey.js's constructor, and latching
  // onto it means the ready instance never arrives.
  function usable(obj) {
    return !!obj && typeof obj.ready === 'function' && typeof obj.emit === 'function'
      && typeof obj.createDevice === 'function';
  }

  function init(homeyObj) {
    if (started) return;
    var candidate = homeyObj || (typeof Homey !== 'undefined' ? Homey : null);
    var ref = usable(candidate) ? candidate : null;
    if (!ref) return;
    if (!document.getElementById('host')) return;  // DOM not ready yet
    started = true;
    H = ref;
    try { H.ready(); } catch (e) { /* ignore */ }
    document.getElementById('btn-connect').addEventListener('click', connect);
    document.getElementById('btn-search').addEventListener('click', search);
    document.getElementById('btn-manual').addEventListener('click', function (e) {
      e.preventDefault();
      show('search-step', false);
      show('host-step', true);
    });
    document.getElementById('host').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') connect();
    });
    bootstrap();
  }

  // The init contract varies by Homey version, so trigger through every
  // mechanism and let the `started` guard collapse the duplicates. Relying on a
  // single callback is what renders the view as a blank page when it doesn't
  // fire.
  function onHomeyReady(homeyObj) { init(homeyObj); }
  document.addEventListener('DOMContentLoaded', function () { init(); });
  window.addEventListener('load', function () { init(); });
  (function poll(n) {
    if (started || n <= 0) return;
    init();
    setTimeout(function () { poll(n - 1); }, 100);
  })(60);
</script>
