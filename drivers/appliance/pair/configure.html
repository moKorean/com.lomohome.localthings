<style>
  /* The pairing webview mixes in its own base styles, so colours are pinned
     rather than following prefers-color-scheme. */
  :root {
    --blue: #1428A0;
    --bg: #f2f2f5;
    --card: #ffffff;
    --text: #1b1b1f;
    --muted: #66666e;
    --border: #e2e2e8;
    --ok: #1e8449;
    --warn: #b9770e;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg) !important; }
  body {
    margin: 0; color: var(--text); font-size: 14px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px;
  }
  h2 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 10px; color: var(--muted); }
  ol { padding-left: 20px; color: var(--muted); margin: 0; }
  li { margin-bottom: 7px; }
  code {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    background: #eeeef2; padding: 1px 5px; border-radius: 5px; color: var(--text);
  }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 13px; }
  input[type=text] {
    width: 100%; padding: 9px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 6px;
  }
  button {
    margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 6px;
    background: var(--blue); color: #fff; font-size: 15px; cursor: pointer;
  }
  button[disabled] { opacity: .55; cursor: default; }
  .msg { margin-top: 13px; font-size: 13px; white-space: pre-wrap; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .msg.warn { color: var(--warn); }
  .spinner {
    display: inline-block; width: 12px; height: 12px; margin-right: 7px;
    border: 2px solid #c9c9d2; border-top-color: var(--blue);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary {
    background: #f4f5f7; border-radius: 8px; padding: 11px;
    margin-top: 13px; font-size: 13px;
  }
  .result {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-top: 9px; background: #fafafc;
  }
  .result-main { min-width: 0; }
  .result-title { font-weight: 600; font-size: 13.5px; }
  .result-sub { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .result button { margin: 0; padding: 7px 13px; font-size: 13px; flex: 0 0 auto; }
  .result.unknown { opacity: .75; }
  .others-title { margin-top: 16px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .others-line { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 14px; }
  a { color: var(--blue); font-size: 13px; }
  .hidden { display: none; }
  #report { margin-top: 12px; }
  textarea {
    width: 100%; margin-top: 8px; padding: 9px; border: 1px solid var(--border);
    border-radius: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    line-height: 1.45; resize: vertical; background: #fafafc; color: var(--text);
    white-space: pre; overflow-x: auto;
  }
  .report-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button.secondary { background: #e8e8ee; color: var(--text); }
  #report-url { word-break: break-all; }
</style>

<div class="wrap">
  <!-- Shown when the app has no certificate yet. Pairing cannot work until it
       does, so this explains where to go rather than failing at Connect. -->
  <div id="setup" class="card hidden">
    <h2 id="t-setup-title"></h2>
    <p id="t-setup-lede"></p>
    <ol id="setup-steps"></ol>
  </div>

  <div id="search-step" class="card hidden">
    <h2 id="t-search-title"></h2>
    <p id="t-search-lede"></p>
    <button id="btn-search"><span id="t-search"></span></button>
    <div id="search-msg" class="msg"></div>
    <div id="results"></div>
    <div id="others"></div>
    <p class="meta" id="t-manual-toggle-hint"></p>
    <a href="#" id="btn-manual"><span id="t-manual"></span></a>
  </div>

  <div id="host-step" class="card hidden">
    <h2 id="t-host-title"></h2>
    <p id="t-host-lede"></p>
    <label id="t-host-label"></label>
    <input type="text" id="host" placeholder="192.168.1.90" inputmode="decimal" autocomplete="off" />
    <button id="btn-connect"><span id="t-connect"></span></button>
    <div id="msg" class="msg"></div>
    <div id="summary" class="summary hidden"></div>
  </div>

  <!-- Only appears when an appliance answered but its type is not mapped yet. The
       dump is shown rather than sent anywhere: what leaves the house is the user's
       decision, and they can read exactly what it contains first. -->
  <div id="report" class="card hidden">
    <h2 id="t-report-title"></h2>
    <p id="t-report-lede"></p>
    <textarea id="report-text" readonly rows="9" spellcheck="false"></textarea>
    <div class="report-actions">
      <button id="btn-report-copy"><span id="t-report-copy"></span></button>
      <button id="btn-report-open" class="secondary"><span id="t-report-open"></span></button>
    </div>
    <p class="meta" id="report-url"></p>
    <div id="report-msg" class="msg"></div>
  </div>

  <!-- Visible from the start so a failure before init can never leave the view
       blank; replaced by one of the cards above as soon as init runs. -->
  <div id="boot" class="card">
    <p><span class="spinner"></span><span id="t-boot"></span></p>
  </div>
</div>

<script type="text/javascript">

  var started = false;
  var LANG = 'en';

  var STRINGS = {

      addThis: 'Add',
      unknownType: 'Unsupported type',
      unknownSub: '{0} · {1} resources · cannot be added yet',
      manualHint: 'Not listed? Some units answer only on ports this scan skips.',
      othersTitle: '{0} other devices answered but could not be identified',
      otherSamsung: '{0} — a Samsung device this app cannot talk to (older firmware, most likely)',
      otherUnknown: '{0} — probably another vendor\u2019s device (MAC {1})',
      otherNoMac: '{0} — could not be identified',
      manual: 'Enter an IP address instead',
      hostTitle: 'Add an appliance',
      hostLede: 'Enter the appliance’s IP address. The port is detected automatically. Find the address in your router’s client list, or in the SmartThings app under the appliance’s network information.',
      hostLabel: 'IP address',
      connect: 'Connect',
      probing: 'Scanning ports and reading appliance state… this can take up to a minute.',
      needHost: 'Enter the appliance’s IP address.',
      unsupported: 'Connected successfully, but this appliance type is not supported yet.',
      unsupportedHint: 'Model {0}, {1} resources. Please open an issue with this model number so support can be added.',
      creating: 'Connected. Adding the appliance…',
      capabilities: '{0} controls available',
    },
    ko: {
      reportTitle: '이 가전의 지원 추가에 도움 주기',
      reportLede: '가전이 스스로 보고하는 내용입니다. 지원을 추가하려면 이 정보가 필요하고, 이건 사용자만 제공할 수 있습니다. 시리얼 번호와 기기 식별자는 가려져 있어 사용자나 기기를 특정할 수 있는 내용은 없습니다.',
      reportCopy: '리포트 복사',
      reportOpen: '이슈 등록 페이지 열기',
      reportCopied: '복사했습니다. 새 이슈에 붙여넣어 주세요.',
      reportCopyManually: '자동 복사가 되지 않았습니다 — 위 내용을 직접 선택해 복사해 주세요.',
      reportOpenManually: '여기서 브라우저를 열 수 없습니다. 아래 주소를 이용해 주세요.',
      probeFailed: '가전에 연결하지 못했습니다. {0}',
      createFailed: '{0}에 연결했지만 Homey가 기기를 추가하지 못했습니다: {1}',
      unknownError: '알 수 없는 오류',
      boot: '불러오는 중…',
      setupTitle: '설정이 필요합니다',
      setupLede: '가전에 연결하려면 클라이언트 인증서가 먼저 필요합니다. 최초 1회만 하면 되고, 집 안 모든 삼성 가전에 적용됩니다.',
      setupSteps: [
        '이 창을 닫습니다.',
        '<b>설정 → 앱 → 로컬띵스 커뮤니티</b>로 이동합니다.',
        '거기 안내에 따라 인증서를 발급해 붙여넣습니다.',
        '다시 <b>기기 → 기기 추가 → 로컬띵스 커뮤니티</b>로 돌아옵니다.',
      ],
      searchTitle: '가전 검색',
      searchLede: '로컬 프로토콜을 사용하는 삼성 가전을 네트워크에서 찾아 종류까지 확인합니다. 1분 이내에 끝납니다.',
      search: '검색',
      searching: '로컬 네트워크를 검색 중… 약 15초 걸립니다.',
      identifying: '응답한 기기 {0}대 발견 — 각각 확인 중입니다. 이 단계가 오래 걸립니다: 기기마다 암호화 핸드셰이크를 따로 해야 하고, 삼성 가전이 아닌 기기는 판정에 가장 오래 걸립니다.',
      progress: '{0} 확인 중 ({2}대 중 {1}번째)…',
      foundNone: '{0}에서 응답한 가전이 없습니다. 구형 펌웨어나 다른 서브넷의 기기는 이 방식으로 찾지 못합니다. 주소를 직접 입력할 수도 있습니다.',
      foundSome: '{1}에서 {0}대를 찾았습니다.',
      searchFailed: '검색이 중단되었습니다: {0}',
      addThis: '추가',
      unknownType: '미지원 종류',
      unknownSub: '{0} · 리소스 {1}개 · 아직 추가할 수 없습니다',
      manualHint: '목록에 없나요? 이 검색이 건너뛴 포트만 응답하는 기기가 있을 수 있습니다.',
      othersTitle: '응답했지만 확인되지 않은 기기 {0}대',
      otherSamsung: '{0} — 삼성 기기이지만 이 앱이 통신할 수 없습니다 (구형 펌웨어일 가능성이 높습니다)',
      otherUnknown: '{0} — 다른 제조사 기기로 보입니다 (MAC {1})',
      otherNoMac: '{0} — 확인할 수 없었습니다',
      manual: '대신 IP 주소 직접 입력',
      hostTitle: '가전 추가',
      hostLede: '가전의 IP 주소를 입력하세요. 포트는 자동으로 찾습니다. 주소는 공유기의 접속 기기 목록이나 SmartThings 앱의 네트워크 정보에서 확인할 수 있습니다.',
      hostLabel: 'IP 주소',
      connect: '연결',
      probing: '포트를 찾고 기기 상태를 읽는 중… 최대 1분 정도 걸릴 수 있습니다.',
      needHost: '가전의 IP 주소를 입력하세요.',
      unsupported: '연결은 성공했지만 아직 지원되지 않는 가전 종류입니다.',
      unsupportedHint: '모델 {0}, 리소스 {1}개. 지원 추가를 위해 이 모델명으로 이슈를 등록해 주세요.',
      creating: '연결됨. 가전을 추가하는 중…',
      capabilities: '사용 가능한 항목 {0}개',
    },
  };

  function t(key) {
    var s = STRINGS[LANG][key];
    if (s === undefined) s = STRINGS.en[key];
    for (var i = 1; i < arguments.length; i++) {
      s = s.replace('{' + (i - 1) + '}', describe(arguments[i]));
    }
    return s;
  }

  // Rejections reaching these handlers are usually not Errors. homey.js rejects with
  // `obj.args[0]` — the value the Python side sent, verbatim — and Homey's own API
  // rejects with structured objects, so `err.message` is frequently absent. Casting
  // those with String() printed "[object Object]", which told the user nothing about a
  // real failure and nothing about which step failed. So walk the shapes that actually
  // occur, and fall back to JSON, which is at least diagnosable.
  function describe(err, depth) {
    if (err === null || err === undefined) return t('unknownError');
    if (typeof err === 'string') return err;
    if (typeof err !== 'object') return String(err);
    if ((depth || 0) > 4) return t('unknownError');
    var keys = ['message', 'error', 'description', 'reason', 'detail', 'statusText'];
    for (var i = 0; i < keys.length; i++) {
      var value = err[keys[i]];
      if (typeof value === 'string' && value) return value;
      if (value && typeof value === 'object') return describe(value, (depth || 0) + 1);
    }
    if (Object.prototype.toString.call(err) === '[object Error]') {
      var text = String(err);
      if (text && text !== '[object Object]') return text;
    }
    try {
      var json = JSON.stringify(err);
      if (json && json !== '{}' && json !== 'null' && json !== '[]') return json;
    } catch (e) { /* circular structure */ }
    return t('unknownError');
  }

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function show(id, visible) {
    document.getElementById(id).classList.toggle('hidden', !visible);
  }

  function message(kind, text, loading) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (kind || '');
    el.innerHTML = (loading ? '<span class="spinner"></span>' : '')
      + (text || '').replace(/</g, '&lt;');
  }

  function applyStrings() {
    setText('t-boot', t('boot'));
    setText('t-setup-title', t('setupTitle'));
    setText('t-setup-lede', t('setupLede'));
    setText('t-search-title', t('searchTitle'));
    setText('t-search-lede', t('searchLede'));
    setText('t-search', t('search'));
    setText('t-manual-toggle-hint', t('manualHint'));
    setText('t-manual', t('manual'));
    setText('t-host-title', t('hostTitle'));
    setText('t-host-lede', t('hostLede'));
    setText('t-host-label', t('hostLabel'));
    setText('t-connect', t('connect'));
    var ol = document.getElementById('setup-steps');
    ol.innerHTML = '';
    STRINGS[LANG].setupSteps.forEach(function (step) {
      var li = document.createElement('li');
      li.innerHTML = step;
      ol.appendChild(li);
    });
  }

  function searchMessage(kind, text, loading) {
    var el = document.getElementById('search-msg');
    el.className = 'msg ' + (kind || '');
    el.innerHTML = (loading ? '<span class="spinner"></span>' : '')
      + (text || '').replace(/</g, '&lt;');
  }

  // Devices added in this window, keyed by serial. The driver also filters by
  // serial, but a device created a moment ago may not be back from get_devices()
  // yet — this side knows for certain what it just created.
  var addedSerials = {};

  function addDiscovered(entry, button) {
    button.disabled = true;
    searchMessage('ok', t('creating'), true);
    H.createDevice(entry.device)
      .then(function () {
        if (entry.serial) addedSerials[entry.serial] = true;
        return H.done();
      })
      .catch(function (err) {
        button.disabled = false;
        searchMessage('err', describe(err));
      });
  }

  function renderResults(appliances) {
    var box = document.getElementById('results');
    box.innerHTML = '';
    appliances.filter(function (entry) {
      return !(entry.serial && addedSerials[entry.serial]);
    }).forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'result' + (entry.recognised ? '' : ' unknown');

      var main = document.createElement('div');
      main.className = 'result-main';
      var title = document.createElement('div');
      title.className = 'result-title';
      title.textContent = entry.recognised ? entry.title : t('unknownType');
      var sub = document.createElement('div');
      sub.className = 'result-sub';
      sub.textContent = entry.recognised
        ? entry.host + ' · ' + entry.model + ' · ' + t('capabilities', entry.capability_count)
        : entry.host + ' · ' + t('unknownSub', entry.model, entry.resource_count);
      main.appendChild(title);
      main.appendChild(sub);
      row.appendChild(main);

      if (entry.recognised) {
        var add = document.createElement('button');
        add.textContent = t('addThis');
        add.addEventListener('click', function () { addDiscovered(entry, add); });
        row.appendChild(add);
      }
      box.appendChild(row);
    });
  }

  // Discovery is a background job polled for status, not a single call:
  // Homey.emit times out after 30s and a full scan takes one to two minutes.
  // Polling also lets each appliance appear as it is identified.
  var pollTimer = null;

  function stopPolling() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function renderOthers(others) {
    var box = document.getElementById('others');
    if (!others || !others.length) { box.innerHTML = ''; return; }
    var lines = others.map(function (o) {
      // 'is_samsung: false' means "not in our OUI list", which is not the same as
      // "not Samsung" — the list cannot be complete, so the wording hedges.
      if (o.is_samsung === true) return t('otherSamsung', o.host);
      if (o.oui) return t('otherUnknown', o.host, o.oui);
      return t('otherNoMac', o.host);
    });
    box.innerHTML = '<div class="others-title">'
      + t('othersTitle', others.length).replace(/</g, '&lt;') + '</div>'
      + lines.map(function (l) {
          return '<div class="others-line">' + l.replace(/</g, '&lt;') + '</div>';
        }).join('');
  }

  function renderState(state) {
    var found = (state && state.appliances) || [];
    if (found.length) renderResults(found);
    if (!state || !state.running) renderOthers(state && state.unidentified);

    if (state && state.running) {
      if (state.phase === 'identifying' && state.total) {
        searchMessage('', state.host
          ? t('progress', state.host, state.index, state.total)
          : t('identifying', state.total), true);
      } else {
        searchMessage('', t('searching'), true);
      }
      return false;
    }

    document.getElementById('btn-search').disabled = false;
    if (state && state.error) {
      searchMessage('err', t('searchFailed', state.error));
    } else if (!found.length) {
      searchMessage('warn', t('foundNone', (state && state.scanned) || ''));
    } else {
      searchMessage('ok', t('foundSome', found.length, state.scanned || ''));
    }
    return true;
  }

  function poll() {
    H.emit('discover_status', {})
      .then(function (state) {
        if (renderState(state)) return;
        pollTimer = setTimeout(poll, 1200);
      })
      .catch(function (err) {
        document.getElementById('btn-search').disabled = false;
        searchMessage('err', describe(err));
      });
  }

  function search() {
    stopPolling();
    document.getElementById('btn-search').disabled = true;
    document.getElementById('results').innerHTML = '';
    searchMessage('', t('searching'), true);

    H.emit('discover_start', { language: LANG })
      .then(function (state) {
        if (renderState(state)) return;
        pollTimer = setTimeout(poll, 1200);
      })
      .catch(function (err) {
        document.getElementById('btn-search').disabled = false;
        searchMessage('err', describe(err));
      });
  }

  // An unsupported appliance is the one case where the user holds information the
  // developer cannot get any other way: its /device/0. Asking them to "open an issue
  // with the model number" was not enough — a model number maps nothing, which is how
  // the range hood shipped with every field name guessed wrong. So the report is
  // built for them, shown in full so they can see what they are sending, and put on
  // the clipboard in one press.
  function showReport(result) {
    if (!result.report) return;
    var box = document.getElementById('report');
    document.getElementById('report-text').value = result.report;
    setText('t-report-title', t('reportTitle'));
    setText('t-report-lede', t('reportLede'));
    setText('t-report-copy', t('reportCopy'));
    setText('t-report-open', t('reportOpen'));
    setText('report-url', result.issue_url || '');
    show('report', true);

    document.getElementById('btn-report-copy').onclick = function () {
      copyReport(result.report);
    };
    var open = document.getElementById('btn-report-open');
    open.onclick = function () {
      // popup() is the only URL-opening call homey.js exposes here, and it is not
      // guaranteed to work in every webview context, so the address stays visible
      // as text either way rather than being hidden behind a button that may do
      // nothing.
      try {
        if (H && typeof H.popup === 'function') H.popup(result.issue_url);
        else reportMessage('warn', t('reportOpenManually'));
      } catch (e) {
        reportMessage('warn', t('reportOpenManually'));
      }
    };
    box.scrollIntoView({ block: 'nearest' });
  }

  function copyReport(text) {
    var area = document.getElementById('report-text');
    var done = function () { reportMessage('ok', t('reportCopied')); };
    // navigator.clipboard needs a secure context and is absent in some webviews;
    // selecting the textarea and using execCommand works where it is not.
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { legacyCopy(area, done); });
        return;
      }
    } catch (e) { /* fall through */ }
    legacyCopy(area, done);
  }

  function legacyCopy(area, done) {
    try {
      area.removeAttribute('readonly');
      area.focus();
      area.setSelectionRange(0, area.value.length);
      var ok = document.execCommand && document.execCommand('copy');
      area.setAttribute('readonly', 'readonly');
      if (ok) return done();
    } catch (e) { /* reported below */ }
    reportMessage('warn', t('reportCopyManually'));
  }

  function reportMessage(kind, text) {
    var el = document.getElementById('report-msg');
    el.className = 'msg ' + (kind || '');
    el.textContent = text;
  }

  function connect() {
    var button = document.getElementById('btn-connect');
    var host = document.getElementById('host').value.trim();
    if (!host) return message('err', t('needHost'));

    show('summary', false);
    button.disabled = true;
    message('', t('probing'), true);

    // Reaching the appliance and having Homey accept it are separate failures with
    // separate fixes — an unreachable address versus a device payload Homey rejects —
    // so they are caught separately. Sharing one handler reported both as the same
    // unattributed error, which left no way to tell which half had gone wrong.
    H.emit('probe', { host: host, language: LANG })
      .catch(function (err) {
        throw new Error(t('probeFailed', describe(err)));
      })
      .then(function (result) {
        button.disabled = false;
        if (!result.recognised) {
          message('warn', t('unsupported') + '\n'
            + t('unsupportedHint', result.model, result.resource_count));
          showReport(result);
          return;
        }
        message('ok', t('creating'), true);
        var summary = document.getElementById('summary');
        summary.textContent = result.model + ' · ' + t('capabilities', result.capability_count);
        show('summary', true);
        return H.createDevice(result.device)
          .catch(function (err) {
            throw new Error(t('createFailed', result.model, describe(err)));
          })
          .then(function () { return H.done(); });
      })
      .catch(function (err) {
        button.disabled = false;
        message('err', describe(err));
      });
  }

  // Ask the webview itself first. The driver also reports a language, but it has
  // to guess at an undocumented Python i18n contract, whereas the view is handed a
  // Homey object that already knows. Both paths are tried before giving up.
  // Order matters. getLanguage() is asked first because it is the UI language;
  // Homey.language is only a cached property and the driver's answer comes from
  // the Python i18n manager, which reports the *app's* language ('en' unless the
  // user's language happens to be the app's default) rather than the user's.
  function resolveLanguage(fromDriver) {
    return new Promise(function (resolve) {
      var settled = false;
      function done(value) {
        if (settled) return;
        settled = true;
        var lang = String(value || H.language || fromDriver || '')
          .slice(0, 2).toLowerCase();
        if (lang === 'ko') LANG = 'ko';
        resolve();
      }
      try {
        var maybe = H.getLanguage && H.getLanguage(function (err, value) {
          done(err ? null : value);
        });
        if (maybe && typeof maybe.then === 'function') {
          maybe.then(done, function () { done(null); });
        } else if (typeof maybe === 'string') {
          done(maybe);
        }
      } catch (e) { /* fall through */ }
      // Never let a missing contract stall the view.
      setTimeout(function () { done(null); }, 2500);
    });
  }

  function reportEnvironment(fromDriver) {
    var info = {
      language_property: typeof H.language === 'string' ? H.language : typeof H.language,
      has_getLanguage: typeof H.getLanguage,
      driver_language: fromDriver || null,
      resolved: LANG,
      homey_keys: [],
    };
    try {
      for (var k in H) { if (typeof H[k] === 'function') info.homey_keys.push(k); }
      info.homey_keys = info.homey_keys.sort().slice(0, 40);
    } catch (e) { /* ignore */ }
    try { H.emit('report_env', info); } catch (e) { /* ignore */ }
  }

  function bootstrap() {
    H.emit('get_state', {})
      .then(function (state) {
        return resolveLanguage(state && state.language).then(function () {
          reportEnvironment(state && state.language);
          return state;
        });
      })
      .then(function (state) {
        applyStrings();
        show('boot', false);
        show('setup', !state.has_credentials);
        show('search-step', !!state.has_credentials);
        show('host-step', false);
      })
      .catch(function (err) {
        // Falling back to the address form keeps the view usable; the real
        // problem then surfaces from Connect with the driver's own message.
        applyStrings();
        show('boot', false);
        show('host-step', true);
        message('err', describe(err));
      });
  }

  // See the settings page for why this checks methods rather than the global's
  // existence: the global starts life as homey.js's constructor, and latching
  // onto it means the ready instance never arrives.
  function usable(obj) {
    return !!obj && typeof obj.ready === 'function' && typeof obj.emit === 'function'
      && typeof obj.createDevice === 'function';
  }

  function init(homeyObj) {
    if (started) return;
    var candidate = homeyObj || (typeof Homey !== 'undefined' ? Homey : null);
    var ref = usable(candidate) ? candidate : null;
    if (!ref) return;
    if (!document.getElementById('host')) return;  // DOM not ready yet
    started = true;
    H = ref;
    try { H.ready(); } catch (e) { /* ignore */ }
    document.getElementById('btn-connect').addEventListener('click', connect);
    document.getElementById('btn-search').addEventListener('click', search);
    document.getElementById('btn-manual').addEventListener('click', function (e) {
      e.preventDefault();
      show('search-step', false);
      show('host-step', true);
    });
    document.getElementById('host').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') connect();
    });
    bootstrap();
  }

  // The init contract varies by Homey version, so trigger through every
  // mechanism and let the `started` guard collapse the duplicates. Relying on a
  // single callback is what renders the view as a blank page when it doesn't
  // fire.
  function onHomeyReady(homeyObj) { init(homeyObj); }
  document.addEventListener('DOMContentLoaded', function () { init(); });
  window.addEventListener('load', function () { init(); });
  (function poll(n) {
    if (started || n <= 0) return;
    init();
    setTimeout(function () { poll(n - 1); }, 100);
  })(60);
</script>
