<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartThings Local</title>
  <script src="/homey.js" data-origin="settings"></script>
  <style>
    :root {
      --blue: #1428A0;
      --bg: #f2f2f5;
      --card: #ffffff;
      --text: #1b1b1f;
      --muted: #66666e;
      --border: #e2e2e8;
      --ok: #1e8449;
      --warn: #b9770e;
      --err: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    .wrap { max-width: 660px; margin: 0 auto; padding: 18px 16px 44px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px; margin-bottom: 14px;
    }
    h1 { font-size: 19px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    p { margin: 0 0 10px; color: var(--muted); }
    ol { margin: 0 0 4px; padding-left: 20px; color: var(--muted); }
    li { margin-bottom: 8px; }
    code, pre {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: #eeeef2; border-radius: 5px; color: var(--text);
    }
    code { padding: 1px 5px; font-size: 12px; }
    pre {
      padding: 10px; font-size: 11.5px; overflow-x: auto;
      white-space: pre; margin: 8px 0 0;
    }
    label { display: block; font-weight: 600; margin: 16px 0 3px; font-size: 13px; }
    .example {
      font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
      color: var(--muted); background: #f7f7fa;
      border: 1px dashed var(--border); border-radius: 6px;
      padding: 8px 9px; margin: 0 0 6px; white-space: pre; overflow-x: auto;
    }
    .example b { color: var(--text); font-weight: 600; }
    textarea {
      width: 100%; height: 108px; padding: 8px;
      border: 1px solid var(--border); border-radius: 6px;
      font-family: ui-monospace, Menlo, monospace; font-size: 11px;
      resize: vertical;
    }
    button {
      margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 6px;
      background: var(--blue); color: #fff; font-size: 14px; cursor: pointer;
    }
    button.secondary { background: #6b6b76; margin-left: 8px; }
    button[disabled] { opacity: .55; cursor: default; }
    .status { display: flex; gap: 9px; align-items: flex-start; }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; }
    .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
    .dot.err { background: var(--err); } .dot.idle { background: #b8b8c0; }
    .msg { margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
    .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
    .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    /* The page had no anchors before, so links would have inherited body colour
       and read as plain text. Underlined and brand-coloured so it looks tappable. */
    a { color: var(--blue); text-decoration: underline; cursor: pointer; }
    .stored {
      border: 1px solid #bfe3cd; background: #f0faf4; border-radius: 8px;
      padding: 11px 12px; margin: 0 0 4px;
    }
    .stored-title { color: var(--ok); font-weight: 600; font-size: 13px; }
    .stored-hint { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
    .spinner {
      display: inline-block; width: 12px; height: 12px; margin-right: 7px;
      border: 2px solid #c9c9d2; border-top-color: var(--blue);
      border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Boot trace. Visible only until init succeeds, then removed. Without it a
         page that stalls before reaching the API gives no clue where it stopped —
         the backend logs nothing, because nothing was called. -->
    <div class="card" id="boot">
      <h2>LocalThings</h2>
      <p class="meta" id="boot-trace">script: ok</p>
    </div>

    <div class="card">
      <h1 id="t-title">SmartThings Local</h1>
      <p id="t-lede"></p>
      <div class="status">
        <div id="dot" class="dot idle"></div>
        <div>
          <div id="status-text"></div>
          <div id="status-meta" class="meta"></div>
        </div>
      </div>
      <p class="meta hidden" id="t-check-hint"></p>
      <button id="btn-check" class="secondary hidden"><span id="t-check"></span></button>
      <div id="check-msg" class="msg"></div>
    </div>

    <div class="card">
      <h2 id="t-how"></h2>
      <p id="t-how-lede"></p>
      <ol id="steps"></ol>
      <pre id="cmd"></pre>
      <p class="meta" id="t-how-note"></p>
    </div>

    <div class="card">
      <h2 id="t-creds"></h2>

      <div id="stored" class="stored hidden">
        <div class="stored-title" id="t-stored-title"></div>
        <div class="stored-hint" id="t-stored-hint"></div>
      </div>

      <label id="t-cert-label"></label>
      <p class="meta" id="t-cert-hint"></p>
      <div class="example" id="ex-cert"></div>
      <textarea id="cert" spellcheck="false"></textarea>

      <label id="t-key-label"></label>
      <p class="meta" id="t-key-hint"></p>
      <div class="example" id="ex-key"></div>
      <textarea id="key" spellcheck="false"></textarea>

      <button id="btn-save"><span id="t-save"></span></button>
      <button id="btn-clear" class="secondary hidden"><span id="t-clear"></span></button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script type="text/javascript">
    var H = null;
    var started = false;
    var LANG = 'en';

    // Shape-only examples. The base64 runs are synthetic filler, not lines copied
    // from anyone's real certificate or key — the point is only to show where the
    // BEGIN/END markers go and that the chain holds several certificates.
    var EX_CERT = '<b>-----BEGIN CERTIFICATE-----</b>\n'
      + 'MIIFAzCCA+ugAwIBAgIUAAAAAAAAAAAAAAAAAAAAAAAAAAAwDQYJ\n'
      + '...\n'
      + '<b>-----END CERTIFICATE-----</b>\n'
      + '<b>-----BEGIN CERTIFICATE-----</b>\n'
      + '...\n'
      + '<b>-----END CERTIFICATE-----</b>';

    var EX_KEY = '<b>-----BEGIN PRIVATE KEY-----</b>\n'
      + 'MIIExAIBADANBgkqhkiG9w0BAQEFAASCBK4wggSqAgEAAoIBAQ\n'
      + '...\n'
      + '<b>-----END PRIVATE KEY-----</b>';

    // The manifest's `support` field is a plain string — the schema types it
    // `string` with a `^(https://|mailto:)` pattern, unlike `name`/`description`
    // which are i18nObjects — so it can only carry one language, and it carries
    // English. Here the language is known, so each language links its own guide.
    var GUIDE = {
      en: 'https://github.com/moKorean/com.lomohome.localthings/blob/main/docs/CA-SETUP.en.md',
      ko: 'https://github.com/moKorean/com.lomohome.localthings/blob/main/docs/CA-SETUP.md',
    };

    var STRINGS = {
      en: {
        unknownError: 'Unknown error',
        lede: 'Controls Samsung appliances directly on your network, without SmartThings. Before adding an appliance, this app needs a client certificate.',
        checking: 'Checking…',
        notConfigured: 'Not set up yet — add a certificate below before adding appliances.',
        valid: 'Ready.',
        invalid: 'The stored certificate has a problem.',
        expired: 'The stored certificate has expired. Mint a new one and paste it below.',
        metaFmt: 'Identity uuid:{0} · expires {1} · {2} certificates in chain',
        check: 'Verify the identity',
        checking2: 'Reading the current identity from Samsung’s gateway…',
        checkHint: 'Appliances only accept a certificate carrying the identity published by Samsung’s cloud gateway. This reads that identity now and compares it with the stored certificate. A mismatch is the one failure that looks like a network problem but is really a certificate that needs re-minting.',
        uuidOk: 'The stored identity still matches what appliances expect.',
        uuidBad: 'Identity mismatch — stored uuid:{0}, appliances now expect uuid:{1}. Mint a new certificate.',
        how: 'How to get a certificate',
        howLede: 'One-time setup. The certificate is not tied to a specific appliance, so a single one works for every Samsung appliance on your network.',
        steps: [
          'On a computer with Python 3 and <code>openssl</code>, clone <code>QuiteYellow/SmartThings-Local</code>.',
          'Run <code>setup_cert.py</code> with the command below. It fetches the public AC14K_M CA bundle, reads the identity from Samsung’s gateway, and signs a fresh key of its own. <code>pyOpenSSL</code> is only needed for the optional <code>--test</code> check. There is a <a href="' + GUIDE.en + '" data-external>step-by-step guide for macOS, Windows and Linux</a>.',
          'Open the two files it writes in <code>certs/</code> and paste their contents below.',
        ],
        howNote: 'Only these two files are needed. The CA private key used to sign them stays on your computer and is never sent to Homey.',
        creds: 'Client certificate',
        storedTitle: 'A certificate and key are stored.',
        storedHint: 'The fields below are intentionally blank — stored keys are never shown again. To change the certificate, paste a new one and save; it replaces what is stored. Otherwise leave this alone.',
        certLabel: 'Certificate chain',
        certHint: 'Paste the whole of certs/client_fullchain.pem. It holds several certificates one after another — the leaf first, then the CA chain. Include every BEGIN/END line. Do not use client.pem: that is the leaf alone and appliances cannot verify it.',
        keyLabel: 'Private key',
        keyHint: 'Paste the whole of certs/client.key, including the BEGIN/END lines. Keep this file private — anyone holding it can control your appliances from your network.',
        save: 'Save',
        clear: 'Remove',
        saving: 'Validating…',
        saved: 'Saved. You can now add appliances under Devices.',
        cleared: 'Certificate removed.',
        needBoth: 'Paste both the certificate chain and the private key.',
      },
      ko: {
        unknownError: '알 수 없는 오류',
        lede: 'SmartThings 없이 삼성 가전을 집 안 네트워크에서 직접 제어합니다. 가전을 추가하기 전에 클라이언트 인증서가 필요합니다.',
        checking: '확인 중…',
        notConfigured: '아직 설정되지 않았습니다 — 가전을 추가하기 전에 아래에서 인증서를 등록하세요.',
        valid: '준비 완료.',
        invalid: '저장된 인증서에 문제가 있습니다.',
        expired: '저장된 인증서가 만료되었습니다. 새로 발급해 아래에 붙여넣으세요.',
        metaFmt: '식별자 uuid:{0} · 만료 {1} · 체인 인증서 {2}개',
        check: '식별자 확인',
        checking2: '삼성 게이트웨이에서 현재 식별자를 읽는 중…',
        checkHint: '가전은 삼성 클라우드 게이트웨이가 공개한 식별자를 담은 인증서만 받아들입니다. 이 버튼은 그 식별자를 지금 읽어와 저장된 인증서와 비교합니다. 불일치는 네트워크 장애처럼 보이지만 실제로는 인증서를 다시 발급해야 하는 유일한 경우입니다.',
        uuidOk: '저장된 식별자가 가전이 기대하는 값과 일치합니다.',
        uuidBad: '식별자 불일치 — 저장값 uuid:{0}, 현재 기대값 uuid:{1}. 인증서를 다시 발급하세요.',
        how: '인증서 발급 방법',
        howLede: '최초 1회만 하면 됩니다. 인증서는 특정 가전에 묶이지 않으므로 하나로 집 안 모든 삼성 가전에 사용됩니다.',
        steps: [
          'Python 3과 <code>openssl</code>이 있는 컴퓨터에서 <code>QuiteYellow/SmartThings-Local</code>을 클론합니다.',
          '아래 명령으로 <code>setup_cert.py</code>를 실행합니다. 공개된 AC14K_M CA 번들을 받아 삼성 게이트웨이에서 식별자를 읽고, 새로 만든 키에 서명합니다. <code>pyOpenSSL</code>은 선택 항목인 <code>--test</code> 시험에만 필요합니다. <a href="' + GUIDE.ko + '" data-external>macOS·Windows·Linux별 상세 안내</a>를 참고하세요.',
          '<code>certs/</code>에 생성된 두 파일을 열어 아래에 붙여넣습니다.',
        ],
        howNote: '이 두 파일만 필요합니다. 서명에 쓰인 CA 개인키는 컴퓨터에 남고 Homey로 전송되지 않습니다.',
        creds: '클라이언트 인증서',
        storedTitle: '키가 저장되어 있습니다.',
        storedHint: '아래 입력란은 의도적으로 비어 있습니다 — 저장된 키는 다시 표시하지 않습니다. 인증서를 변경하려면 새 값을 붙여넣고 저장하세요. 기존 값을 덮어씁니다. 변경할 필요가 없으면 그대로 두세요.',
        certLabel: '인증서 체인',
        certHint: 'certs/client_fullchain.pem 전체를 붙여넣으세요. 인증서 여러 개가 연달아 들어 있습니다 — 리프가 먼저, 그 뒤에 CA 체인입니다. BEGIN/END 줄을 모두 포함하세요. client.pem은 안 됩니다: 리프 하나뿐이어서 가전이 검증할 수 없습니다.',
        keyLabel: '개인키',
        keyHint: 'certs/client.key 전체를 BEGIN/END 줄까지 포함해 붙여넣으세요. 이 파일은 비밀로 관리하세요 — 키를 가진 사람은 같은 네트워크에서 가전을 제어할 수 있습니다.',
        save: '저장',
        clear: '삭제',
        saving: '검증 중…',
        saved: '저장되었습니다. 이제 기기 화면에서 가전을 추가할 수 있습니다.',
        cleared: '인증서를 삭제했습니다.',
        needBoth: '인증서 체인과 개인키를 모두 붙여넣으세요.',
      },
    };

    var CMD = [
      'git clone https://github.com/QuiteYellow/SmartThings-Local.git',
      'cd SmartThings-Local',
      'python3 -m venv .venv && .venv/bin/pip install pyOpenSSL',
      '',
      '# TARGET_IP is optional: it verifies the certificate against a real',
      '# appliance before you paste it. Use any Samsung appliance IP.',
      'OUT_DIR=./certs TARGET_IP=192.168.1.90 \\',
      '  .venv/bin/python setup_cert.py --test',
    ].join('\n');

    function t(key) {
      var s = STRINGS[LANG][key];
      if (s === undefined) s = STRINGS.en[key];
      for (var i = 1; i < arguments.length; i++) {
        s = s.replace('{' + (i - 1) + '}', describe(arguments[i]));
      }
      return s;
    }

    // Rejections reaching these handlers are usually not Errors. homey.js rejects with
    // `obj.args[0]` — the value the Python side sent, verbatim — and Homey's own API
    // rejects with structured objects, so `err.message` is frequently absent. Casting
    // those with String() printed "[object Object]", which told the user nothing about a
    // real failure and nothing about which step failed. So walk the shapes that actually
    // occur, and fall back to JSON, which is at least diagnosable.
    function describe(err, depth) {
      if (err === null || err === undefined) return t('unknownError');
      if (typeof err === 'string') return err;
      if (typeof err !== 'object') return String(err);
      if ((depth || 0) > 4) return t('unknownError');
      var keys = ['message', 'error', 'description', 'reason', 'detail', 'statusText'];
      for (var i = 0; i < keys.length; i++) {
        var value = err[keys[i]];
        if (typeof value === 'string' && value) return value;
        if (value && typeof value === 'object') return describe(value, (depth || 0) + 1);
      }
      if (Object.prototype.toString.call(err) === '[object Error]') {
        var text = String(err);
        if (text && text !== '[object Object]') return text;
      }
      try {
        var json = JSON.stringify(err);
        if (json && json !== '{}' && json !== 'null' && json !== '[]') return json;
      } catch (e) { /* circular structure */ }
      return t('unknownError');
    }

    function setText(id, value) {
      var el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function applyStrings() {
      setText('t-lede', t('lede'));
      setText('status-text', t('checking'));
      setText('t-check', t('check'));
      setText('t-check-hint', t('checkHint'));
      setText('t-how', t('how'));
      setText('t-how-lede', t('howLede'));
      setText('t-how-note', t('howNote'));
      setText('t-creds', t('creds'));
      setText('t-cert-label', t('certLabel'));
      setText('t-cert-hint', t('certHint'));
      setText('t-key-label', t('keyLabel'));
      setText('t-key-hint', t('keyHint'));
      setText('t-save', t('save'));
      setText('t-clear', t('clear'));
      setText('t-stored-title', t('storedTitle'));
      setText('t-stored-hint', t('storedHint'));
      document.getElementById('cmd').textContent = CMD;
      document.getElementById('ex-cert').innerHTML = EX_CERT;
      document.getElementById('ex-key').innerHTML = EX_KEY;
      document.getElementById('cert').placeholder = '-----BEGIN CERTIFICATE-----';
      document.getElementById('key').placeholder = '-----BEGIN PRIVATE KEY-----';
      var ol = document.getElementById('steps');
      ol.innerHTML = '';
      STRINGS[LANG].steps.forEach(function (step) {
        var li = document.createElement('li');
        li.innerHTML = step;
        ol.appendChild(li);
      });
      externalise(ol);
    }

    // Inside Homey's settings webview a plain href either does nothing or replaces
    // the settings page itself, so hand the URL to the host and swallow the click.
    // Falling through to normal navigation would strand the user on a page with no
    // way back, so an unavailable openURL is left as a no-op link instead.
    function externalise(root) {
      var links = root.querySelectorAll('a[data-external]');
      Array.prototype.forEach.call(links, function (a) {
        var url = a.getAttribute('href');
        a.addEventListener('click', function (event) {
          event.preventDefault();
          // H, not the global Homey — see usable() below: the global is still the
          // constructor until the instance lands, and only the instance has openURL.
          if (H && typeof H.openURL === 'function') H.openURL(url);
        });
      });
    }

    function setStatus(kind, text, meta) {
      document.getElementById('dot').className = 'dot ' + kind;
      setText('status-text', text);
      setText('status-meta', meta || '');
    }

    function show(id, visible) {
      document.getElementById(id).classList.toggle('hidden', !visible);
    }

    function message(kind, text) {
      var el = document.getElementById('msg');
      el.className = 'msg ' + (kind || '');
      el.textContent = text || '';
    }

    function checkMessage(kind, text, loading) {
      var el = document.getElementById('check-msg');
      el.className = 'msg ' + (kind || '');
      el.innerHTML = (loading ? '<span class="spinner"></span>' : '')
        + (text || '').replace(/</g, '&lt;');
    }

    // Homey.api is promise-based and takes no callback; older builds are
    // callback-style. Support both, because waiting on a callback a
    // promise-based implementation never invokes is an infinite spinner.
    function api(method, path, body) {
      return new Promise(function (resolve, reject) {
        var settled = false;
        function ok(result) { if (!settled) { settled = true; resolve(result); } }
        function fail(err) {
          if (settled) return;
          settled = true;
          reject(err instanceof Error ? err
            : new Error(describe(err)));
        }
        var args = (method === 'GET') ? [method, path] : [method, path, body || {}];
        var maybe;
        try {
          maybe = H.api.apply(H, args.concat([function (err, result) {
            if (err) fail(err); else ok(result);
          }]));
        } catch (e) {
          return fail(e);
        }
        if (maybe && typeof maybe.then === 'function') maybe.then(ok, fail);
        setTimeout(function () {
          fail(new Error('Homey.api did not respond (' + method + ' ' + path + ')'));
        }, 20000);
      });
    }

    function refresh() {
      return api('GET', '/status')
        .then(function (s) {
          s = s || {};
          if (!s.configured) {
            setStatus('warn', t('notConfigured'));
            show('btn-check', false);
            show('t-check-hint', false);
            show('btn-clear', false);
            show('stored', false);
            return;
          }
          if (!s.valid) {
            setStatus('err', t('invalid'), s.error);
            show('btn-check', false);
            show('t-check-hint', false);
            show('btn-clear', true);
            // Stored, but unusable — don't call it ready; the error is the point.
            show('stored', false);
            return;
          }
          var meta = t('metaFmt', s.uuid, s.expires, s.chain_length);
          setStatus(s.expired ? 'err' : 'ok', s.expired ? t('expired') : t('valid'), meta);
          show('btn-check', true);
          show('t-check-hint', true);
          show('btn-clear', true);
          show('stored', !s.expired);
        })
        .catch(function (err) {
          setStatus('err', describe(err));
        });
    }

    function wire() {
      document.getElementById('btn-save').addEventListener('click', function () {
        var button = this;
        var certPem = document.getElementById('cert').value.trim();
        var keyPem = document.getElementById('key').value.trim();
        if (!certPem || !keyPem) return message('err', t('needBoth'));
        button.disabled = true;
        message('', t('saving'));
        api('POST', '/credentials', { cert_pem: certPem, key_pem: keyPem })
          .then(function () {
            button.disabled = false;
            message('ok', t('saved'));
            // Don't leave key material sitting in the textarea afterwards.
            document.getElementById('key').value = '';
            return refresh();
          })
          .catch(function (err) {
            button.disabled = false;
            message('err', describe(err));
          });
      });

      document.getElementById('btn-clear').addEventListener('click', function () {
        api('POST', '/credentials-clear', {})
          .then(function () { message('ok', t('cleared')); return refresh(); })
          .catch(function (err) { message('err', describe(err)); });
      });

      document.getElementById('btn-check').addEventListener('click', function () {
        var button = this;
        button.disabled = true;
        // Rendered under this button, not in the credentials card three cards down the
        // page: feedback that appears somewhere else reads as nothing happening.
        checkMessage('', t('checking2'), true);
        api('GET', '/check-uuid')
          .then(function (r) {
            button.disabled = false;
            r = r || {};
            if (r.error) return checkMessage('err', r.error);
            checkMessage(r.ok ? 'ok' : 'err',
              r.ok ? t('uuidOk') : t('uuidBad', r.stored, r.live));
          })
          .catch(function (err) {
            button.disabled = false;
            checkMessage('err', describe(err));
          });
      });
    }

    function trace(step) {
      var el = document.getElementById('boot-trace');
      if (el) el.textContent += ' · ' + step;
    }

    // homey.js exposes the language two ways and neither is synchronous in the
    // way it first appears: Homey.language is only set once i18n has loaded, and
    // getLanguage() returns a Promise. Comparing its return value directly — as
    // this did — compares against a Promise and always falls through to English.
    function resolveLanguage() {
      return new Promise(function (resolve) {
        function done(value) {
          if (typeof value === 'string' && value.slice(0, 2).toLowerCase() === 'ko') {
            LANG = 'ko';
          }
          resolve();
        }
        try {
          if (typeof H.language === 'string' && H.language) return done(H.language);
          var maybe = H.getLanguage && H.getLanguage(function (err, value) {
            done(err ? null : value);
          });
          if (maybe && typeof maybe.then === 'function') return maybe.then(done, function () { done(null); });
          if (typeof maybe === 'string') return done(maybe);
        } catch (e) { /* fall through to English */ }
        setTimeout(function () { resolve(); }, 3000);
      });
    }

    // homey.js defines a global `Homey` *constructor* up front and only replaces
    // it with the ready instance at the very end (window.Homey = this, right
    // before onHomeyReady). Accepting the global on sight therefore latches onto
    // the constructor, which has neither .ready() nor .api() — and once latched,
    // the real onHomeyReady is ignored, so ready() is never called and Homey's
    // loading overlay stays up forever. Check for the methods, not the name.
    function usable(obj) {
      return !!obj && typeof obj.ready === 'function' && typeof obj.api === 'function';
    }

    function init(homeyObj) {
      if (started) return;
      var candidate = homeyObj || (typeof Homey !== 'undefined' ? Homey : null);
      var ref = usable(candidate) ? candidate : null;
      if (!ref) { trace('no Homey instance yet'); return; }
      if (!document.getElementById('cert')) { trace('no DOM yet'); return; }
      started = true;
      H = ref;
      trace('init ok (api=' + (typeof ref.api) + ')');
      var boot = document.getElementById('boot');
      if (boot) boot.parentNode.removeChild(boot);

      applyStrings();
      wire();
      try { H.ready(); } catch (e) { /* ignore */ }
      resolveLanguage().then(function () {
        applyStrings();
        // Messages raised from Python cannot work out the user's language on their
        // own — Homey's Python i18n reports the app's — so tell the app what this
        // page resolved.
        api('POST', '/language', { language: LANG }).catch(function () { /* cosmetic */ });
      });
      refresh();
    }

    // The init contract varies by Homey version, so trigger through every
    // mechanism and let the `started` guard collapse the duplicates. Relying on
    // one callback is what renders the page blank when it doesn't fire.
    function onHomeyReady(homeyObj) { trace('onHomeyReady'); init(homeyObj); }
    document.addEventListener('DOMContentLoaded', function () { trace('DOM'); init(); });
    window.addEventListener('load', function () { trace('load'); init(); });
    (function poll(n) {
      if (started || n <= 0) {
        if (!started) trace('gave up after 6s — Homey object never arrived');
        return;
      }
      init();
      setTimeout(function () { poll(n - 1); }, 100);
    })(60);
    window.onerror = function (msg, src, line) {
      trace('JS error: ' + msg + ' @' + line);
    };
  </script>
</body>
</html>
